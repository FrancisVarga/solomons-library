[project]
name = "solomons-library"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastmcp[code-mode,tasks]>=3.2.2",
    "google-genai>=1.16.1",
    "granian>=2.7.3",
    "httpx>=0.28.0",
    "loguru>=0.7.3",
    "openai>=1.82.0",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.3.3",
    "py-key-value-aio[redis]>=0.4.4,<0.5.0",
    "python-dotenv>=1.2.2",
    "redis>=6.2.0",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.scripts]
solomons-library = "solomons_library.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solomons_library"]
